name: Checks
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check go.mod
        run: |
          go mod tidy -diff

      - name: Run gofmt
        run: |
          find . -type f -name '*.go' -not -path './fixtures/*' -exec gofmt -w {} +
          git diff --exit-code

  tests:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - oldstable
          - stable
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test -race -shuffle=on ./...
